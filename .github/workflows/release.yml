name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, for example v1.0.1"
        required: true
        type: string
      notes:
        description: "Release notes body. If empty, the workflow links to CHANGELOG.md."
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Version must look like v1.2.3" >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ffmpeg \
            hackrf \
            libhackrf-dev \
            libncurses-dev \
            pkg-config \
            python3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/catalog/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install catalog dependencies
        run: npm --prefix ./scripts/catalog ci

      - name: Verify project
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run check
          npm run build
          npm run check:bundle
          npm run test:e2e:run
          npm run test:e2e:auth

      - name: Prepare release notes
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > RELEASE_NOTES.md
          else
            {
              printf '## %s\n\n' "$VERSION"
              printf 'See CHANGELOG.md for the release highlights.\n'
            } > RELEASE_NOTES.md
          fi

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "hackrf-webui $VERSION"
          git push origin "$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=("$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
